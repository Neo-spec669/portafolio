<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Centro de herramientas</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c111d;
    --panel:#131a2b;
    --line:#27324b;
    --text:#eef2fb;
    --muted:#9aa7c4;
    --cyan:#34d3ff;
    --blue:#4f80f5;
    --amber:#ffb347;
    --display:'Bricolage Grotesque','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--ink);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
  body{overflow-x:hidden}

  /* Página: altura mínima fija para que el iframe de SharePoint mida siempre lo mismo en escritorio */
  .page{
    position:relative;min-height:760px;display:flex;flex-direction:column;overflow:hidden;
    background:
      radial-gradient(900px 520px at 78% 46%, rgba(52,211,255,.10), transparent 62%),
      radial-gradient(640px 420px at 6% 100%, rgba(79,128,245,.10), transparent 60%),
      var(--ink);
  }
  .page::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(154,167,196,.16) 1px, transparent 1.2px);
    background-size:26px 26px;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 28%,#000 72%,transparent);
            mask-image:linear-gradient(180deg,transparent,#000 28%,#000 72%,transparent);
  }

  /* Barra superior (sin enlaces: no hay a dónde ir desde aquí) */
  .top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:24px 5%}
  .brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
  .mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:20px;height:20px}
  .mark i{border-radius:3px;background:linear-gradient(135deg,var(--cyan),var(--blue))}
  .mark i.a{background:var(--amber)}

  /* Hero */
  .hero{
    position:relative;z-index:1;flex:1;display:grid;
    grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);
    align-items:center;gap:4vw;padding:8px 5% 96px;
  }
  h1{
    font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:1.04;
    font-size:clamp(2.3rem,4.1vw,3.7rem);max-width:15em;text-wrap:balance;
  }
  .lead{margin-top:24px;max-width:34em;color:var(--muted);font-size:1.125rem;line-height:1.65}
  .replay{
    margin-top:32px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;
    padding:12px 20px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--text);font:600 .95rem var(--body);
    transition:border-color .2s, background .2s;
  }
  .replay:hover{border-color:var(--cyan);background:rgba(52,211,255,.07)}
  .replay:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
  .replay:disabled{opacity:.55;cursor:default}
  .replay svg{width:16px;height:16px}

  /* Escenario: el desorden (ámbar) se convierte en un tablero ordenado (azules) */
  .stage{position:relative;width:100%;max-width:640px;aspect-ratio:6/5;margin-left:auto}
  .frame{
    position:absolute;inset:0;border-radius:16px;border:1px solid var(--line);
    background:linear-gradient(180deg,#141c2f,#101728);
    box-shadow:0 40px 90px -24px rgba(0,0,0,.65);
  }
  .frame::before{content:"";position:absolute;left:0;right:0;top:0;height:9%;border-bottom:1px solid var(--line)}
  .dots{position:absolute;left:3.6%;top:3.4%;width:8px;height:8px;border-radius:50%;background:#3a4767;box-shadow:14px 0 #3a4767,28px 0 #3a4767}

  .p{
    position:absolute;border-radius:6px;background:var(--amber);transform-origin:center;
    transition:transform .95s cubic-bezier(.22,.9,.24,1), background-color .7s ease, opacity .6s ease;
    will-change:transform;
  }
  .stage.init .p{transition:none !important}
  .settled .p{background:var(--fin)}
  .kpi,.chartbg{box-shadow:inset 0 0 0 1px var(--line)}

  /* Detalle interno de las tarjetas: líneas que sugieren etiqueta y valor */
  .kpi::before,.kpi::after{content:"";position:absolute;left:10%;border-radius:3px;opacity:0}
  .kpi::before{top:24%;width:34%;height:9%;background:rgba(154,167,196,.5)}
  .kpi::after{top:52%;width:var(--v);height:20%;background:var(--cyan)}
  .settled .kpi::before,.settled .kpi::after{opacity:1;transition:opacity .5s .8s}

  /* Barras de avance */
  .p i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit;background:var(--cyan)}
  .settled .p i{width:var(--pw);transition:width .9s .6s cubic-bezier(.22,.9,.24,1)}

  /* Línea de tendencia (la única señal en ámbar dentro del orden) */
  .trend{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #trend{fill:none;stroke:var(--amber);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
  .settled #trend{stroke-dashoffset:0;transition:stroke-dashoffset 1.3s ease 1s}
  .dot{
    position:absolute;width:11px;height:11px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 0 5px rgba(255,179,71,.22);transform:translate(-50%,-50%) scale(0);
  }
  .settled .dot{transform:translate(-50%,-50%) scale(1);transition:transform .4s ease 2.15s}

  /* Indicador para seguir bajando (las herramientas están debajo, en SharePoint) */
  .cue{
    position:absolute;left:0;right:0;bottom:22px;z-index:2;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:.9rem;
  }
  .cue svg{width:22px;height:22px;stroke:var(--cyan);animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  @media (max-width:900px){
    .hero{grid-template-columns:1fr;gap:36px;padding-bottom:110px}
    .stage{max-width:520px;margin:0 auto}
  }
  @media (prefers-reduced-motion:reduce){
    .p,.p i,#trend,.dot,.kpi::before,.kpi::after{transition:none !important}
    .cue svg{animation:none}
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i class="a"></i></span>
      <span>Centro de herramientas</span>
    </div>
  </header>

  <main class="hero">
    <div class="copy">
      <h1>Automatizo lo repetitivo para que tú te enfoques en decidir.</h1>
      <p class="lead">Explora las herramientas que desarrollo para reducir errores, evitar la captura manual y trabajar con mejores datos.</p>
      <button class="replay" id="replay" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Ver cómo se ordena
      </button>
    </div>

    <div class="stage init" id="stage" aria-hidden="true">
      <div class="frame"><span class="dots"></span></div>
      <svg class="trend" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid meet">
        <path id="trend" pathLength="1" d=""/>
      </svg>
      <span class="dot" id="dot"></span>
    </div>
  </main>

  <div class="cue">
    <span>Las herramientas están justo debajo</span>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </div>
</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  var trend = document.getElementById('trend');
  var dot   = document.getElementById('dot');
  var btn   = document.getElementById('replay');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pieces = [];
  var busy = false;

  function rand(a,b){ return a + Math.random()*(b-a); }

  function add(o){
    var el = document.createElement('div');
    el.className = 'p ' + (o.cls || '');
    el.style.left = o.x + '%';
    el.style.top = o.y + '%';
    el.style.width = o.w + '%';
    el.style.height = o.h + '%';
    el.style.setProperty('--fin', o.fin || '#2a3651');
    if (o.v)  el.style.setProperty('--v', o.v);
    if (o.r)  el.style.borderRadius = o.r;
    if (o.pw != null){
      var i = document.createElement('i');
      i.style.setProperty('--pw', o.pw + '%');
      el.appendChild(i);
    }
    stage.insertBefore(el, stage.querySelector('.trend'));
    pieces.push({el:el, o:o});
  }

  /* --- Composición del tablero final (coordenadas en % del escenario) --- */
  var kv = ['58%','72%','44%'];
  for (var k=0;k<3;k++) add({cls:'kpi', x:4+k*31.4, y:15, w:29.2, h:17, fin:'#1b2540', v:kv[k], r:'10px'});

  add({cls:'chartbg', x:4, y:35, w:58, h:37, fin:'#151d31', r:'10px'});

  var H = [9,14,12,19,16,23,20,26];
  var barColors = ['#3e6be0','#4574ec','#4f80f5','#4a8df3','#41a2f6','#38b8fb','#34c9ff','#7fe3ff'];
  var pts = [];
  for (var b=0;b<H.length;b++){
    var bx = 7 + b*6.6;
    add({cls:'bar', x:bx, y:69-H[b], w:4.6, h:H[b], fin:barColors[b], r:'4px 4px 2px 2px'});
    pts.push([bx+2.3, 69-H[b]-5]);
  }

  var pr = [82,64,91,47];
  for (var q=0;q<4;q++) add({cls:'track', x:66, y:39+q*9, w:30, h:4.2, fin:'#26314b', pw:pr[q], r:'999px'});

  var rows = [77,84,91];
  var status = ['#1f8fb0','#3b5fc0','#3a7fd0'];
  for (var r=0;r<3;r++){
    add({cls:'cell', x:4,  y:rows[r], w:19, h:5, fin:'#334162'});
    add({cls:'cell', x:25, y:rows[r], w:31, h:5, fin:'#2a3651'});
    add({cls:'cell', x:58, y:rows[r], w:18, h:5, fin:'#2a3651'});
    add({cls:'cell', x:78, y:rows[r], w:18, h:5, fin:status[r], r:'999px'});
  }

  /* Fichas sueltas: son el "ruido" que desaparece al ordenar */
  for (var s=0;s<10;s++) add({cls:'stray', x:rand(4,88), y:rand(12,88), w:rand(5,12), h:rand(3,6)});

  /* Línea de tendencia sobre las barras (viewBox 600x500 = escenario 6:5) */
  var d = pts.map(function(p,i){ return (i?'L':'M') + (p[0]*6).toFixed(1) + ' ' + (p[1]*5).toFixed(1); }).join(' ');
  trend.setAttribute('d', d);
  var last = pts[pts.length-1];
  dot.style.left = last[0] + '%';
  dot.style.top  = last[1] + '%';

  /* --- Movimiento --- */
  function scatter(){
    var w = stage.clientWidth, h = stage.clientHeight;
    pieces.forEach(function(p){
      var o = p.o, pw = o.w/100*w, ph = o.h/100*h;
      /* Cada pieza se encoge a "ficha" y cae en un punto al azar dentro de la ventana */
      var longest = Math.max(pw, ph);
      var sc = Math.min(1, Math.max(.2, rand(.05,.11)*w/longest));
      var cx = rand(w*.09, w*.91), cy = rand(h*.17, h*.91);
      var dx = cx - (o.x/100*w + pw/2), dy = cy - (o.y/100*h + ph/2);
      p.el.style.transitionDelay = '0ms';
      p.el.style.opacity = rand(.6,.95).toFixed(2);
      p.el.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) rotate(' + rand(-40,40).toFixed(1) + 'deg) scale(' + sc.toFixed(2) + ')';
    });
  }

  function settle(){
    stage.classList.add('settled');
    pieces.forEach(function(p,i){
      var delay = reduce ? 0 : Math.round(i*20 + rand(0,140));
      p.el.style.transitionDelay = delay + 'ms';
      if (p.o.cls === 'stray'){
        p.el.style.opacity = 0;
        p.el.style.transform = 'translate(0,0) scale(.2)';
      } else {
        p.el.style.opacity = 1;
        p.el.style.transform = 'translate(0,0) rotate(0deg) scale(1)';
      }
    });
  }

  scatter();
  if (reduce){
    settle();
  } else {
    void stage.offsetWidth;            /* fija la posición inicial sin animar */
    stage.classList.remove('init');
    setTimeout(settle, 700);
  }

  btn.addEventListener('click', function(){
    if (busy) return;
    busy = true; btn.disabled = true;
    stage.classList.remove('settled');
    if (reduce){ scatter(); setTimeout(function(){ settle(); busy=false; btn.disabled=false; }, 300); return; }
    scatter();
    setTimeout(function(){ settle(); }, 1100);
    setTimeout(function(){ busy=false; btn.disabled=false; }, 3200);
  });
})();
</script>
</body>
</html>
